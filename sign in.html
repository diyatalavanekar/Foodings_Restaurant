  <!-- Sign Up Form -->
  <div class="form-container">
    <h1>Sign Up</h1>
    <form name="signupForm" method="post" action="signup_input.php" onsubmit="return validateForm()">
      <label for="u_name">Full Name:</label>
      <input type="text" name="fullname" id="fullname" required>

      <label for="u_email">Email:</label>
      <input type="email" name="email" id="email" required>

      <label for="u_username">Username:</label>
      <input type="text" name="username" id="username" required minlength="3">

      <label for="u_password">Password:</label>
      <input type="password" name="password" id="password" required minlength="6">

      <input type="submit" value="Sign Up">
    </form>

    <div class="login-text">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script>
    function validateForm() {
      const fullname = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (fullname === "" || !/^[a-zA-Z\s]+$/.test(fullname)) {
        alert("Please enter a valid full name (letters only).");
        return false;
      }
      if (username.length < 3) {
        alert("Username must be at least 3 characters long.");
        return false;
      }
      if (!email.includes("@") || !email.includes(".")) {
        alert("Please enter a valid email address.");
        return false;
      }
      if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return false;
      }
      return true;
    }
  </script>
