<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diora Pet Shop - Login</title>
  <style>
    /* Body Styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      position: relative;
    }

    /* Logo Section */
    .logo {
      text-align: center;
      background-color: white;
      position: relative;
      z-index: 1;
    }

    /* Navigation Bar */
    .topnav {
      overflow: hidden;
      background-color: white;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .topnav a {
      display: inline-block;
      color: rgb(48,47,81);
      text-align: center;
      padding: 20px 20px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .topnav a:hover {
      background-color: rgb(48,47,81);
      color: white;
    }

    .username {
      position: absolute;
      right: 20px;
      top: 20px;
      font-weight: bold;
      color: rgb(48,47,81);
    }

    /* Login Section with Background Image */
    .login-section {
      background: url('login background.jpg') no-repeat center center;
      background-size: cover;
      padding: 60px 0; /* vertical space around login box */
    }

    /* Login Box */
    .login-box {
      width: 320px;
      margin: 0 auto; /* center horizontally */
      padding: 25px;
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .login-box:hover {
      box-shadow: 0 15px 25px rgba(0,0,0,0.3);
      transform: translateY(-5px);
    }

    .login-box h2 {
      text-align: center;
      color: rgb(48,47,81);
      margin-bottom: 20px;
    }

    .login-box label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: rgb(48,47,81);
    }

    .login-box input {
      width: 95%;
      display: block;
      margin: 0 auto 15px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    /* Submit Button Styling */
    .login-box button {
      width: 95%;
      display: block;
      margin: 0 auto;
      padding: 12px;
      background-color: white;
      color: rgb(48,47,81);
      border: 2px solid rgb(48,47,81);
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-box button:hover {
      background-color: rgb(48,47,81);
      color: white;
      transform: scale(1.05);
    }

    /* Sign-up link */
    .signup-text {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: rgb(48,47,81);
    }

    .signup-text a {
      color: rgb(48,47,81);
      font-weight: bold;
      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* Footer */
    .footer {
      background: rgb(48,47,81);
      color: white;
      padding: 40px 80px 20px;
      position: relative;
      z-index: 1;
    }

    .footer-container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 40px;
    }

    .footer-section {
      flex: 1;
      min-width: 200px;
    }

    .footer-logo {
      height: 70px;
      margin-bottom: 10px;
    }

    .footer-brand {
      font-weight: bold;
      font-size: 16px;
    }

    .footer-section h4 {
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid white;
      display: inline-block;
      padding-bottom: 5px;
    }

    .footer-section ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .footer-section ul li {
      margin: 8px 0;
    }

    .footer-section ul li a {
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .footer-section ul li a:hover {
      color: lightgray;
    }

    .footer-bottom {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      border-top: 1px solid white;
      padding-top: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .footer-container {
        flex-direction: column;
        text-align: center;
      }
      .login-box {
        margin-right: auto;
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <div class="logo">
    <img src="logo.jpg" height="130" width="500">
  </div>

  <!-- Top Border Line -->
  <hr style="border:2px solid rgb(48,47,81);">

  <!-- Navigation Bar -->
  <div class="topnav">
    <a href="home.html">Home</a>
    <a href="Menu.html">Menu</a>
    <a href="Order.html">Order</a>
    <a class="active" href="login.html">Log in</a>
    <a href="contact.html">Contact Us</a>
    <span class="username" id="username-display"></span>
  </div>

  <!-- Bottom Border Line -->
  <hr style="border:2px solid rgb(48,47,81);">

  <!-- Login Section with Background Image -->
  <div class="login-section">
    <div class="login-box">
      <h2>Login</h2>
      <form id="loginForm" name="login" method="post" action="login.php" onsubmit="return validateForm()">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required minlength="3">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="6">

        <button type="submit">Login</button>
      </form>

      <div class="signup-text">
        Don’t have an account? <a href="sign in.html">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    function validateForm() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username.length < 3) {
        alert("Username must be at least 3 characters long.");
        return false;
      }
      if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return false;
      }
      return true; // form submits to login.php
    }
  </script>

  <!--Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-section">
        <img src="logo.jpg" alt="Logo" class="footer-logo">
        <p class="footer-brand">By Diya & Shital</p>
      </div>

      <div class="footer-section">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="contact.html">Contact Us</a></li>
          <li><a href="payment.html">Payment</a></li>
          <li><a href="ratings.html">Ratings</a></li>
          <li><a href="about.html">About Us</a></li>
        </ul>
      </div>

      <div class="footer-section">
        <h4>Contact</h4>
        <p>Email: diyashital@gmail.com</p>
        <p>Phone: +91 7756053060</p>
      </div>
    </div>

    <div class="footer-bottom">
      <p>© 2025 Your Website. All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
